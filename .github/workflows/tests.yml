name: tests

# Runs on every push and pull request to main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit + API tests (release blocking)
        run: python -m pytest tests -v --junitxml=reports/junit.xml

      - name: Security scan with Bandit (SAST, release blocking on medium+)
        run: bandit -r app -ll

      - name: Performance smoke test (p95 < 200 ms)
        run: python -m tests.perf_smoke

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/
