name: tests

# Runs on every push and pull request to main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit + API tests (release blocking)
        run: |
          set -o pipefail
          mkdir -p reports
          python -m pytest tests -v --junitxml=reports/junit.xml | tee reports/ci_pytest.txt
          {
            echo "## Unit + API tests"
            echo '```'
            tail -n 25 reports/ci_pytest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Security scan with Bandit (SAST, release blocking on medium+)
        run: |
          set -o pipefail
          bandit -r app -ll | tee reports/ci_bandit.txt
          {
            echo "## Bandit security scan"
            echo '```'
            cat reports/ci_bandit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Performance smoke test (p95 < 200 ms)
        run: |
          set -o pipefail
          python -m tests.perf_smoke | tee reports/ci_perf.json
          {
            echo "## Performance smoke test"
            echo '```json'
            cat reports/ci_perf.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish results as annotations
        if: always()
        run: |
          note() { python3 -c 'import sys,urllib.parse;t=open(sys.argv[2]).read() if len(sys.argv)>2 else "";print("::notice title="+sys.argv[1]+"::"+t.replace("%","%25").replace("\r","").replace("\n","%0A"))' "$@"; }
          tail -n 25 reports/ci_pytest.txt > /tmp/p.txt || true
          note "Unit and API tests" /tmp/p.txt
          note "Bandit security scan" reports/ci_bandit.txt || true
          note "Performance smoke test" reports/ci_perf.json || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: reports/
